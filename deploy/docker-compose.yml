# Nexrelm self-host stack — GUI + control plane. Docker is an OPTION; the
# bare-metal installer (deploy/install-nexrelm.sh) is the other path.
#
#   cd deploy && docker compose up --build -d
#   docker compose exec control-plane npx tsx src/cli.ts setup   # create the admin (prints the password)
#   open http://localhost:3007
#
# Notes:
#  • Persistent state lives in the named volume `nexrelm-data` (auth, DBs, TLS,
#    settings) — your admin + data survive rebuilds.
#  • Full packet capture / SYN scans / DHCP serving need host networking +
#    NET_RAW/NET_ADMIN — uncomment the `network_mode`/`cap_add` lines below.
#    Without them you still get the GUI, DNS resolver, auth and most modules.
#  • For HTTPS, front the stack with deploy/Caddyfile, or generate a cert in the
#    volume: docker compose exec control-plane sh -c 'NEXRELM_DATA=/data bash deploy/gen-cert.sh /data' && docker compose restart control-plane
services:
  control-plane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: nexrelm/control-plane:0.1.0
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      CORS_ORIGIN: "*"
      TICK_MS: "2000"
      NEXRELM_DATA: "/data"
    volumes:
      - nexrelm-data:/data
    ports:
      - "8787:8787"
    # For wire/L2 capture, DHCP serving and SYN scans, run on the host network
    # with raw-socket capabilities (Linux host only):
    # network_mode: host
    # cap_add: [NET_RAW, NET_ADMIN, NET_BIND_SERVICE]
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # Baked at build time — the browser hits these from the host. Change to
        # your LAN IP / public origin for remote access, then rebuild.
        NEXT_PUBLIC_API_URL: "http://localhost:8787"
        NEXT_PUBLIC_WS_URL: "ws://localhost:8787/ws"
    image: nexrelm/web:0.1.0
    ports:
      - "3007:3007"
    depends_on:
      - control-plane
    restart: unless-stopped

volumes:
  nexrelm-data:
